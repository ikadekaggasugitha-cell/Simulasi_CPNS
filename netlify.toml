[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # bun.lock uses lockfile format v2, which requires Bun >= 1.4.0 (the build image defaults to Bun 1.3.12)
  BUN_VERSION = "1.4.4"
  VITE_STORAGE_MODE = "local"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
